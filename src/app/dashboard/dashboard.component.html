<section>
  <h2 class="section-heading">Dashboard EcoRuta</h2>

  <div class="row g-4 mb-5">
    <div class="col-md-4">
      <app-stat-card title="Total de Rutas" [value]="totalRutas()" variant="mid" />
    </div>
    <div class="col-md-4">
      <app-stat-card title="Dificultad Promedio" [value]="dificultadPromedio()" variant="ochre" />
    </div>
    <div class="col-md-4">
      @if (rutaMasPopular(); as ruta) {
        <app-popular-card [ruta]="ruta" />
      }
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-6">
      <app-region-panel [regiones]="rutasPorRegion()" />
    </div>
    <div class="col-md-6">
      <app-recomendaciones-panel />
    </div>
  </div>
</section>
