<article class="popular-card h-100">
  <span class="stat-label">Ruta Más Popular</span>
  <p class="route-name">{{ ruta().nombre }}</p>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" [style.width.%]="ruta().popularidad"></div>
  </div>
  <small>{{ ruta().popularidad }}% popularidad</small>
</article>
